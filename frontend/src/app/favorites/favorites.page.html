<ion-header><ion-toolbar><ion-buttons slot="start"><ion-back-button defaultHref="/tabs/more"></ion-back-button></ion-buttons><ion-title>Favorites</ion-title></ion-toolbar></ion-header>

<ion-content>
  <main class="page wtc-direct-page">
    <app-state *ngIf="loading" kind="loading" heading="Loading saved recipes"></app-state>

    <app-state *ngIf="!loading && loadError" kind="error" heading="Favorites are unavailable" [message]="loadError" actionLabel="Try again" (action)="load()"></app-state>

    <p *ngIf="message" class="wtc-notice" role="status">{{ message }}</p>

    <ng-container *ngIf="!loading && !loadError">
      <ion-card *ngFor="let recipe of recipes">
        <img [src]="image(recipe)" [alt]="recipe.name" (error)="fallback($event)">
        <ion-card-header><ion-card-title>{{ recipe.name }}</ion-card-title><ion-card-subtitle>{{ recipe.servings || 2 }} servings &middot; {{ (recipe.prep_time || 0) + (recipe.cook_time || 0) }} min</ion-card-subtitle></ion-card-header>
        <ion-card-content><p>{{ recipe.description }}</p><ion-button fill="outline" (click)="open(recipe)">View recipe</ion-button><ion-button fill="clear" color="danger" (click)="remove(recipe)">Remove</ion-button></ion-card-content>
      </ion-card>

      <app-state *ngIf="!recipes.length" kind="empty" iconName="heart-outline" heading="No saved recipes" message="Save recipes from Discover to find them here.">
        <ion-button fill="outline" routerLink="/tabs/recipes">Browse recipes</ion-button>
      </app-state>
    </ng-container>
  </main>
</ion-content>
