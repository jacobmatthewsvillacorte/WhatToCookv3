<ion-header><ion-toolbar><ion-buttons slot="start"><ion-back-button defaultHref="/tabs/more"></ion-back-button></ion-buttons><ion-title>Settings</ion-title></ion-toolbar></ion-header>
<ion-content><main class="page wtc-direct-page settings-page" id="main-content"><h1>Appearance</h1><ion-list inset="true"><ion-item><ion-icon name="moon-outline" slot="start" aria-hidden="true"></ion-icon><ion-label><h2>Dark mode</h2><p>Use a darker appearance in low light.</p></ion-label><ion-toggle slot="end" aria-label="Dark mode" [checked]="theme.dark" (ionChange)="theme.setDark($any($event.detail.checked))"></ion-toggle></ion-item></ion-list><h1>Notifications</h1><ion-list inset="true"><ion-item><ion-icon name="notifications-outline" slot="start" aria-hidden="true"></ion-icon><ion-label><h2>Freshness reminders</h2><p>Optional 9:00 AM reminders for future expiry or freshness-review dates. Dates are reminders, not food-safety advice.</p></ion-label><ion-toggle slot="end" aria-label="Freshness reminders" [checked]="reminderEnabled" [disabled]="savingReminders" (ionChange)="changeReminders($any($event.detail.checked))"></ion-toggle></ion-item></ion-list><p class="wtc-notice" *ngIf="reminderMessage" role="status" aria-live="polite">{{ reminderMessage }}</p></main></ion-content>
