<ion-header><ion-toolbar><ion-buttons slot="start"><ion-back-button defaultHref="/tabs/more"></ion-back-button></ion-buttons><ion-title>Meal history</ion-title></ion-toolbar></ion-header>

<ion-content>
  <main class="page wtc-direct-page">
    <p *ngIf="household">Meals cooked for {{ household.name }}</p>
    <p class="wtc-notice" *ngIf="message" role="status">{{ message }}</p>

    <section class="export-tools" *ngIf="!loading && !loadError && items.length">
      <ion-note>Export this {{ household ? 'shared' : 'personal' }} history</ion-note>
      <div><ion-button size="small" fill="clear" (click)="export('text')">Text</ion-button><ion-button size="small" fill="clear" (click)="export('image')">Image</ion-button><ion-button size="small" fill="clear" (click)="export('pdf')">PDF</ion-button></div>
    </section>

    <app-state *ngIf="loading" kind="loading" heading="Loading meal history"></app-state>

    <app-state *ngIf="!loading && loadError" kind="error" heading="Meal history is unavailable" [message]="loadError" actionLabel="Try again" (action)="load()"></app-state>

    <ng-container *ngIf="!loading && !loadError">
      <ion-list *ngIf="items.length">
        <ion-item *ngFor="let item of items"><ion-icon name="restaurant-outline" slot="start"></ion-icon><ion-label><h2>{{ recipeName(item) }}</h2><p>{{ item.prepared_at | date:'mediumDate' }} &middot; {{ item.servings || 1 }} servings</p><p *ngIf="item.notes">{{ item.notes }}</p></ion-label></ion-item>
      </ion-list>

      <app-state *ngIf="!items.length" kind="empty" iconName="time-outline" heading="No meals cooked yet" message="Cook a scheduled meal to start your history.">
        <ion-button fill="outline" routerLink="/tabs/meal-plan">View meal plan</ion-button>
      </app-state>
    </ng-container>
  </main>
</ion-content>
